<head>
<meta charset="UTF-8">

<title>扫码收款</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #e8edf5 100%);
    color: #2d3436;
  }
  .card {
    background: #ffffff;
    border-radius: 24px;
    padding: 48px 40px 40px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10);
    max-width: 420px;
    width: 92%;
  }
  .title { font-size: 26px; font-weight: 700; letter-spacing: 2px; }
  .subtitle {
    margin-top: 8px;
    font-size: 14px;
    color: #8a919b;
    letter-spacing: 1px;
  }
  .qr-wrap {
    margin: 32px auto 20px;
    width: 260px;
    height: 260px;
    padding: 12px;
    border-radius: 18px;
    background: #ffffff;
    border: 1px solid #eef1f5;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
  }
  .qr-wrap img { width: 100%; height: 100%; display: block; border-radius: 10px; }
  .tips {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 8px;
    font-size: 13px;
    color: #6b7280;
  }
  .tips .dot { width: 6px; height: 6px; border-radius: 50%; background: #34c759; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .divider { margin: 28px 0 20px; border: none; border-top: 1px solid #f0f2f5; }
  .amount { font-size: 15px; color: #5a6169; }
  .amount b { font-size: 22px; color: #1a1a1a; }
  footer { margin-top: 22px; font-size: 12px; color: #b0b6bf; }
</style>
</head>
