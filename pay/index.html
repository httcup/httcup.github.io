<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫码收款</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(7, 193, 96, 0.10), transparent 60%),
      radial-gradient(1200px 600px at 85% 110%, rgba(22, 119, 255, 0.10), transparent 60%),
      linear-gradient(160deg, #f7f9fc 0%, #eef2f8 100%);
    color: #2d3436;
  }
  .page-title { font-size: 28px; font-weight: 800; letter-spacing: 3px; }
  .page-subtitle { margin-top: 10px; font-size: 14px; color: #8a919b; letter-spacing: 1px; }
  .cards {
    display: flex;
    flex-wrap: nowrap;
    gap: 20px;
    margin-top: 36px;
    justify-content: center;
  }
  .card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    border-radius: 24px;
    padding: 26px 22px 22px;
    text-align: center;
    width: 272px;
    box-shadow: 0 20px 50px rgba(31, 45, 61, 0.10), 0 2px 8px rgba(31, 45, 61, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.9);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 28px 60px rgba(31, 45, 61, 0.16), 0 2px 8px rgba(31, 45, 61, 0.05);
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #fff;
  }
  .card.wechat .brand { background: linear-gradient(135deg, #07c160, #06ad56); box-shadow: 0 6px 16px rgba(7, 193, 96, .35); }
  .card.alipay .brand { background: linear-gradient(135deg, #1677ff, #0e5fe8); box-shadow: 0 6px 16px rgba(22, 119, 255, .35); }
  .brand svg { width: 18px; height: 18px; fill: #fff; }
  .qr-wrap {
    margin: 20px auto 14px;
    width: 196px;
    height: 196px;
    padding: 8px;
    border-radius: 16px;
    background: #fff;
    position: relative;
  }
  .card.wechat .qr-wrap { border: 2px solid rgba(7, 193, 96, .35); }
  .card.alipay .qr-wrap { border: 2px solid rgba(22, 119, 255, .35); }
  .card.wechat .qr-wrap::before,
  .card.alipay .qr-wrap::before {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 16px;
    pointer-events: none;
  }
  .card.wechat .qr-wrap::before { box-shadow: inset 0 0 0 0 rgba(7,193,96,0), inset 0 0 24px rgba(7, 193, 96, .08); }
  .card.alipay .qr-wrap::before { box-shadow: inset 0 0 0 0 rgba(22,119,255,0), inset 0 0 24px rgba(22, 119, 255, .08); }
  .qr-wrap img { width: 100%; height: 100%; display: block; border-radius: 10px; }
  .hint { font-size: 13px; color: #6b7280; letter-spacing: .5px; }
  .hint .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; animation: pulse 1.6s infinite; }
  .card.wechat .hint .dot { background: #07c160; }
  .card.alipay .hint .dot { background: #1677ff; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  footer { margin-top: 40px; font-size: 12px; color: #b0b6bf; letter-spacing: 1px; }
  @media (max-width: 600px) {
    .cards { flex-wrap: wrap; gap: 22px; }
    .card { width: min(320px, 100%); }
    .qr-wrap { width: 228px; height: 228px; padding: 10px; }
  }
</style>
</head>
<body>
  <div class="page-title">扫码收款</div>
  <div class="page-subtitle">选择任一方式，长按或扫码即可付款</div>

  <div class="cards">
    <div class="card wechat">
      <span class="brand">
        <svg viewBox="0 0 24 24"><path d="M8.69 3.5C4.98 3.5 2 6.05 2 9.2c0 1.77.96 3.35 2.46 4.4l-.62 1.86 2.16-1.08c.62.17 1.28.27 1.96.29a4.9 4.9 0 0 1-.13-1.1c0-2.98 2.86-5.4 6.38-5.4.22 0 .44.01.65.03C14.2 5.6 11.7 3.5 8.69 3.5zM6.6 7.3a.85.85 0 1 1 0 1.7.85.85 0 0 1 0-1.7zm4.35 0a.85.85 0 1 1 0 1.7.85.85 0 0 1 0-1.7zM15.2 9.5c-3.18 0-5.77 2.1-5.77 4.68 0 2.58 2.59 4.68 5.77 4.68.55 0 1.09-.07 1.6-.2l1.9.95-.55-1.64c1.32-.9 2.17-2.26 2.17-3.79 0-2.58-2.6-4.68-5.12-4.68zm-1.85 2.4a.75.75 0 1 1 0 1.5.75.75 0 0 1 0-1.5zm3.85 0a.75.75 0 1 1 0 1.5.75.75 0 0 1 0-1.5z"/></svg>
        微信支付
      </span>
      <div class="qr-wrap"><img src="wechat_qr.png" alt="微信收款码"></div>
      <div class="hint"><span class="dot"></span>打开微信「扫一扫」付款</div>
    </div>

    <div class="card alipay">
      <span class="brand">
        <svg viewBox="0 0 24 24"><path d="M18.4 13.3c-.9.6-1.9 1.1-2.9 1.5-2.5 1.1-5.1 1.7-7.3 1.9-1 .1-1.9.1-2.7 0-.8-.1-1.5-.3-2-.6-.4-.3-.7-.7-.7-1.2 0-.3.1-.6.3-.9l.5-.7c.2-.2.4-.5.7-.7-.3.5-.5 1-.4 1.4.1.6.7 1 1.6 1.1 1 .1 2.3 0 3.7-.3 2.2-.5 4.8-1.4 7.2-2.6-.7-1.3-1.1-2.7-1.3-4h-3.2V7h4c0-.6-.1-1.2-.1-1.7h-2.2V3.6h-1.6v1.7H8.2V7h5.3c.2 1.1.5 2.2 1 3.2-2.3 1-4.4 1.6-6.1 1.6-1.5 0-2.6-.5-2.9-1.4-.3-.9.4-2 1.8-3l.6-.4-.5-.4C5.7 8 4.6 9.5 4.6 10.9c0 1.5 1.3 2.6 3.4 2.6 2 0 4.4-.7 6.9-1.9.5.9 1.2 1.7 1.9 2.4-1.5.7-3 1.2-4.4 1.5 3.9 2.4 8.5 2.7 9.6 2.1v-1.8c-1.2-.4-2.5-1.2-3.6-2.5z"/></svg>
        支付宝
      </span>
      <div class="qr-wrap"><img src="alipay_qr.png" alt="支付宝收款码"></div>
      <div class="hint"><span class="dot"></span>打开支付宝「扫一扫」付款</div>
    </div>
  </div>

  <footer>感谢您的支持 · 收款金额由您输入</footer>
</body>
</html>
