<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业邮箱登录</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", system-ui, sans-serif;
        }

        /* 页面居中布局（可删除，仅预览用） */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fa;
            padding: 20px;
        }

        /* 重写美化登录面板样式 - 替换原版丑陋样式 */
        .bizmail_loginpanel {
            font-size: 14px;
            width: 100%;
            max-width: 380px;
            height: auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            border: none;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .bizmail_loginpanel:hover {
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
        }

        .bizmail_LoginBox {
            padding: 30px 25px;
        }

        /* 新增Logo样式 */
        .bizmail-logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .bizmail-logo img {
            width: auto;
            height: 48px;
            object-fit: contain;
        }

        .bizmail_loginpanel h3 {
            padding-bottom: 15px;
            margin: 0 0 25px 0;
            border-bottom: 1px solid #f0f2f5;
            font-size: 20px;
            font-weight: 600;
            color: #1f2937;
            text-align: center;
        }

        .bizmail_loginpanel form {
            margin: 0;
            padding: 0;
        }

        /* 表单行布局 */
        .bizmail_loginpanel .bizmail_column {
            height: auto;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        .bizmail_loginpanel .bizmail_column label {
            display: block;
            float: none;
            width: 60px;
            height: auto;
            line-height: 1;
            font-size: 14px;
            color: #4b5563;
            font-weight: 500;
        }

        .bizmail_loginpanel .bizmail_column .bizmail_inputArea {
            float: none;
            width: calc(100% - 60px);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 输入框美化 */
        .bizmail_loginpanel input.text {
            flex: 1;
            font-size: 14px;
            width: 100%;
            height: 44px;
            margin: 0;
            padding: 0 15px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            transition: all 0.25s ease;
            background: #fafbfc;
        }

        .bizmail_loginpanel input.text:focus {
            outline: none;
            border-color: #4096ff;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(64, 150, 255, 0.15);
        }

        /* 域名后缀/下拉框美化 */
        .bizmail_loginpanel .bizmail_column span {
            font-size: 14px;
            color: #666;
            margin-left: 2px;
            line-height: 1;
        }

        .bizmail_loginpanel select {
            width: 130px;
            height: 44px;
            margin: 0;
            padding: 0 10px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
            background: #fafbfc;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .bizmail_loginpanel select:focus {
            outline: none;
            border-color: #4096ff;
            background: #fff;
        }

        /* 提交按钮区域 */
        .bizmail_loginpanel .bizmail_SubmitArea {
            margin-left: 0;
            clear: both;
            margin-top: 10px;
        }

        .bizmail_loginpanel .bizmail_SubmitArea input[type="submit"] {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #4096ff, #2979ff);
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .bizmail_loginpanel .bizmail_SubmitArea input[type="submit"]:hover {
            background: linear-gradient(135deg, #2979ff, #1967d2);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(64, 150, 255, 0.3);
        }

        .bizmail_loginpanel .bizmail_SubmitArea a {
            display: inline-block;
            margin-top: 15px;
            margin-left: 0;
            font-size: 13px;
            color: #4096ff;
            text-decoration: none;
            text-align: center;
            width: 100%;
        }

        .bizmail_loginpanel .bizmail_SubmitArea a:hover {
            text-decoration: underline;
        }
    </style>

    <!-- 修复：替换HTTP为HTTPS、编码改为UTF-8 -->
    <script type="text/javascript" src="https://exmail.qq.com/zh_CN/htmledition/js_biz/outerlogin.js" charset="UTF-8"></script>

    <script type="text/javascript">
        // 重写渲染函数，插入官方Logo图片
        const oldWriteLoginPanel = writeLoginPanel;
        writeLoginPanel = function(e){
            oldWriteLoginPanel(e);
            // 给登录面板顶部添加Logo
            const panel = document.querySelector('.bizmail_LoginBox');
            if(panel && !document.querySelector('.bizmail-logo')){
                const logoDiv = document.createElement('div');
                logoDiv.className = 'bizmail-logo';
                logoDiv.innerHTML = '<img src="https://rescdn.qqmail.com/bizmail/zh_CN/htmledition/images/logo/logo_biz_new/logo_biz_24_04748d4.png" alt="腾讯企业邮箱">';
                // 插入到标题上方
                const title = panel.querySelector('h3');
                panel.insertBefore(logoDiv, title);
            }
        }

        // 【核心配置】修改这里为你的企业邮箱域名，多域名用分号分隔 例：xxx.com;xxx.cn
        writeLoginPanel({
            domainlist: "undefined163t.cn", 
            mode: "vertical"
        });
    </script>
</head>
<body>
    <!-- JS自动渲染登录面板+Logo，无需手动写HTML结构 -->
</body>
</html>
