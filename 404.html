<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · 页面走丢了 | 小胡小胡的书签</title>

  <meta name="description" content="要访问的页面不存在，回到小胡小胡的书签首页继续找吧。">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#3cb884" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">

  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">
  <link rel="mask-icon" href="/assets/favicon/favicon-32x32.png" color="#0b0b0f">

  <!-- 主题预置：避免刷新时闪白 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) { }
    })();
  </script>

  <style>
    :root {
      --brand: #3cb884;
      --brand-2: #0ba665;
      --brand-3: #0a8a55;

      --page-bg:
        radial-gradient(1100px 620px at 12% -12%, rgba(60, 184, 132, .18), transparent 62%),
        radial-gradient(900px 520px at 88% 112%, rgba(11, 166, 101, .14), transparent 60%),
        linear-gradient(165deg, #f8fbf9 0%, #edf4f0 100%);

      --card-bg: rgba(255, 255, 255, .74);
      --card-border: rgba(255, 255, 255, .92);
      --card-shadow: 0 34px 80px -34px rgba(9, 70, 48, .38), 0 2px 10px rgba(16, 40, 30, .05);

      --text: #1e2a25;
      --text-strong: #16211c;
      --muted: #6f7f78;
      --faint: #a6b3ad;

      --line: rgba(16, 40, 30, .10);
      --chip: rgba(60, 184, 132, .10);
      --code-bg: rgba(16, 40, 30, .05);

      --ghost-border: rgba(16, 40, 30, .14);
      --ghost-hover: rgba(16, 40, 30, .04);

      --folder-back: #0ba665;
      --folder-front-a: #3cb884;
      --folder-front-b: #2ea877;
      --paper-1: #e9efec;
      --paper-2: #f3f7f5;
      --paper-3: #ffffff;
      --paper-line: rgba(16, 40, 30, .07);
      --glass-stroke: #0a8a55;
      --glass-fill: rgba(255, 255, 255, .96);
      --glow: rgba(60, 184, 132, .30);
    }

    html.dark {
      --page-bg:
        radial-gradient(1100px 620px at 12% -12%, rgba(60, 184, 132, .16), transparent 62%),
        radial-gradient(900px 520px at 88% 112%, rgba(11, 166, 101, .12), transparent 60%),
        linear-gradient(165deg, #111418 0%, #0d1113 100%);

      --card-bg: rgba(26, 31, 36, .72);
      --card-border: rgba(255, 255, 255, .07);
      --card-shadow: 0 34px 80px -34px rgba(0, 0, 0, .8), 0 2px 10px rgba(0, 0, 0, .35);

      --text: #e7ecf0;
      --text-strong: #f4f7f9;
      --muted: #97a3ad;
      --faint: #6d7883;

      --line: rgba(255, 255, 255, .10);
      --chip: rgba(60, 184, 132, .16);
      --code-bg: rgba(255, 255, 255, .06);

      --ghost-border: rgba(255, 255, 255, .16);
      --ghost-hover: rgba(255, 255, 255, .06);

      --folder-back: #0a8a55;
      --folder-front-a: #34a877;
      --folder-front-b: #268a63;
      --paper-1: #38424a;
      --paper-2: #434e57;
      --paper-3: #4c5862;
      --paper-line: rgba(255, 255, 255, .10);
      --glass-stroke: #6ad2a5;
      --glass-fill: rgba(30, 38, 44, .94);
      --glow: rgba(60, 184, 132, .22);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      color-scheme: light;
      -webkit-text-size-adjust: 100%;
    }

    html.dark {
      color-scheme: dark;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background: var(--page-bg);
      background-attachment: fixed;
      color: var(--text);
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background-color .3s ease, color .3s ease;
    }

    /* ---------- 顶栏 ---------- */
    .topbar {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-strong);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .4px;
      border-radius: 12px;
      padding: 6px 8px 6px 6px;
      transition: background-color .2s ease;
    }

    .brand:hover {
      background: var(--ghost-hover);
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(140deg, var(--folder-front-a), var(--brand-2));
      box-shadow: 0 6px 16px -6px rgba(11, 166, 101, .7);
      flex: none;
    }

    .brand-mark svg {
      width: 17px;
      height: 17px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 38px;
      padding: 0 14px;
      border-radius: 11px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--muted);
      text-decoration: none;
      border: 1px solid transparent;
      transition: all .2s ease;
    }

    .top-link:hover {
      color: var(--brand-2);
      background: var(--ghost-hover);
      border-color: var(--line);
    }

    .theme-btn {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      border: 1px solid var(--line);
      background: var(--card-bg);
      color: var(--muted);
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all .2s ease;
    }

    .theme-btn:hover {
      color: var(--brand-2);
      border-color: var(--ghost-border);
      transform: translateY(-1px);
    }

    .theme-btn svg {
      width: 18px;
      height: 18px;
    }

    .icon-moon {
      display: none;
    }

    html.dark .icon-sun {
      display: none;
    }

    html.dark .icon-moon {
      display: block;
    }

    /* ---------- 主体 ---------- */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px 40px;
    }

    .card {
      width: 100%;
      max-width: 620px;
      min-width: 0;
      text-align: center;
      padding: 40px 40px 34px;
      border-radius: 28px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      position: relative;
      overflow: hidden;
    }

    /* 卡片顶部一条品牌色渐变亮线 */
    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 12%;
      right: 12%;
      height: 2px;
      border-radius: 0 0 4px 4px;
      background: linear-gradient(90deg, transparent, var(--brand), transparent);
      opacity: .75;
    }

    .illustration {
      width: 190px;
      margin: 0 auto 6px;
      animation: float 6s ease-in-out infinite;
    }

    .illustration svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-7px);
      }
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--chip);
      color: var(--brand-3);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 1.6px;
      text-transform: uppercase;
    }

    html.dark .eyebrow {
      color: #7ee0b4;
    }

    .code {
      margin: 12px 0 2px;
      font-size: clamp(76px, 15vw, 118px);
      line-height: .92;
      font-weight: 800;
      letter-spacing: -4px;
      background: linear-gradient(150deg, var(--folder-front-a) 6%, var(--brand-2) 62%, var(--brand-3) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      filter: drop-shadow(0 14px 26px var(--glow));
    }

    h1 {
      margin: 8px 0 10px;
      font-size: clamp(21px, 3.2vw, 26px);
      font-weight: 800;
      letter-spacing: .5px;
      color: var(--text-strong);
    }

    .desc {
      font-size: 14.5px;
      line-height: 1.85;
      color: var(--muted);
      max-width: 430px;
      margin: 0 auto;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 46px;
      padding: 0 24px;
      border-radius: 13px;
      font-size: 14.5px;
      font-weight: 700;
      font-family: inherit;
      letter-spacing: .3px;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      transition: transform .2s ease, box-shadow .2s ease, background-color .2s ease, border-color .2s ease;
      white-space: nowrap;
    }

    .btn svg {
      width: 16px;
      height: 16px;
      transition: transform .2s ease;
    }

    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, var(--folder-front-a), var(--brand-2));
      box-shadow: 0 14px 30px -12px rgba(11, 166, 101, .85), inset 0 1px 0 rgba(255, 255, 255, .25);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 38px -14px rgba(11, 166, 101, .95), inset 0 1px 0 rgba(255, 255, 255, .25);
    }

    .btn-primary:hover svg {
      transform: translateX(3px);
    }

    .btn-ghost {
      color: var(--text);
      background: transparent;
      border-color: var(--ghost-border);
    }

    .btn-ghost:hover {
      transform: translateY(-2px);
      background: var(--ghost-hover);
      border-color: var(--brand);
      color: var(--brand-3);
    }

    .btn:focus-visible,
    .theme-btn:focus-visible,
    .brand:focus-visible,
    .top-link:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 3px;
    }

    .path-line {
      margin-top: 26px;
      padding-top: 20px;
      border-top: 1px dashed var(--line);
      font-size: 12.5px;
      color: var(--faint);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .path-line code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 8px;
      background: var(--code-bg);
      color: var(--muted);
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ---------- 页脚 ---------- */
    footer {
      padding: 0 24px 26px;
      text-align: center;
      font-size: 12px;
      letter-spacing: .6px;
      color: var(--faint);
    }

    footer a {
      color: var(--muted);
      text-decoration: none;
      transition: color .2s ease;
    }

    footer a:hover {
      color: var(--brand-2);
    }

    /* ---------- 响应式 ---------- */
    @media (max-width: 520px) {
      .topbar {
        padding: 14px 16px;
      }

      main {
        padding: 8px 16px 32px;
      }

      .card {
        padding: 30px 22px 26px;
        border-radius: 22px;
      }

      .illustration {
        width: 156px;
      }

      .brand span.brand-text {
        font-size: 15px;
      }

      .top-link {
        padding: 0 10px;
        height: 36px;
      }

      .actions {
        gap: 10px;
      }

      .btn {
        height: 44px;
        padding: 0 20px;
        flex: 1 1 auto;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .illustration,
      .radar {
        animation: none !important;
      }

      * {
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="返回小胡小胡的书签首页">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.2L5 21V4a1 1 0 0 1 1-1z"></path>
        </svg>
      </span>
      <span class="brand-text">小胡小胡的书签</span>
    </a>

    <div class="topbar-right">
      <a class="top-link" href="/">首页</a>
      <button class="theme-btn" id="themeToggleButton" type="button" aria-label="切换深色 / 浅色主题">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"></circle>
          <path d="M12 2.6v2.2M12 19.2v2.2M4.4 12H2.2M21.8 12h-2.2M6.4 6.4 4.8 4.8M19.2 19.2l-1.6-1.6M6.4 17.6l-1.6 1.6M19.2 4.8l-1.6 1.6">
          </path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5 8.9 8.9 0 1 0 20.5 14.6Z"></path>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <section class="card">
      <!-- 空文件夹 + 放大镜：呼应主页的书签文件夹卡片 -->
      <div class="illustration" aria-hidden="true">
        <svg viewBox="0 0 220 170" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="frontGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="var(--folder-front-a)"></stop>
              <stop offset="1" stop-color="var(--folder-front-b)"></stop>
            </linearGradient>
            <linearGradient id="backGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="var(--folder-back)"></stop>
              <stop offset="1" stop-color="var(--brand-3)"></stop>
            </linearGradient>
            <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
              <stop offset="0" stop-color="var(--folder-back)" stop-opacity=".22"></stop>
              <stop offset="1" stop-color="var(--folder-back)" stop-opacity="0"></stop>
            </radialGradient>
          </defs>

          <ellipse cx="110" cy="158" rx="80" ry="10" fill="url(#floorShadow)"></ellipse>

          <!-- 文件夹背板（带左上标签页） -->
          <path
            d="M22 42h54a14 14 0 0 1 11.2 5.6L96 60h102a16 16 0 0 1 16 16v54a16 16 0 0 1-16 16H22a16 16 0 0 1-16-16V58a16 16 0 0 1 16-16Z"
            fill="url(#backGrad)"></path>

          <!-- 里面的书签纸页 -->
          <g class="papers">
            <rect x="50" y="42" width="128" height="72" rx="10" fill="var(--paper-1)"
              transform="rotate(-6 114 78)"></rect>
            <rect x="53" y="36" width="128" height="72" rx="10" fill="var(--paper-2)"
              transform="rotate(-2.5 117 72)"></rect>
            <rect x="56" y="30" width="128" height="72" rx="10" fill="var(--paper-3)"></rect>
            <g stroke="var(--paper-line)" stroke-width="5" stroke-linecap="round">
              <line x1="74" y1="50" x2="150" y2="50"></line>
              <line x1="74" y1="64" x2="166" y2="64"></line>
              <line x1="74" y1="78" x2="132" y2="78"></line>
            </g>
          </g>

          <!-- 文件夹前板 -->
          <path d="M22 100h176a16 16 0 0 1 16 16v14a16 16 0 0 1-16 16H22a16 16 0 0 1-16-16v-14a16 16 0 0 1 16-16Z"
            fill="url(#frontGrad)"></path>
          <path d="M22 100h176a16 16 0 0 1 16 16v2H6v-2a16 16 0 0 1 16-16Z" fill="#fff" opacity=".18"></path>

          <!-- 放大镜 -->
          <g class="radar" style="transform-origin:166px 48px;">
            <line x1="187" y1="69" x2="199" y2="82" stroke="var(--glass-stroke)" stroke-width="10"
              stroke-linecap="round"></line>
            <circle cx="166" cy="48" r="27" fill="var(--glass-fill)"></circle>
            <circle cx="166" cy="48" r="27" fill="none" stroke="var(--glass-stroke)" stroke-width="7"></circle>
            <text x="166" y="49" text-anchor="middle" dominant-baseline="central" font-size="25" font-weight="700"
              fill="var(--glass-stroke)" font-family="Segoe UI, PingFang SC, sans-serif">?</text>
          </g>
        </svg>
      </div>

      <div class="eyebrow">Error 404</div>
      <div class="code">404</div>
      <h1>这个页面走丢了</h1>
      <p class="desc">
        它可能被删掉、搬了家，或者地址少打了一个字。<br>
        别急，从下面的入口接着逛吧。
      </p>

      <div class="actions">
        <a class="btn btn-primary" href="https://xhxh.vip/">
          进入小胡小胡的书签
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14"></path>
            <path d="m13 6 6 6-6 6"></path>
          </svg>
        </a>
        <a class="btn btn-ghost" href="https://139t.cn/">
          进入小胡小胡的工具箱
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M7 17 17 7"></path>
            <path d="M9 7h8v8"></path>
          </svg>
        </a>
      </div>

      <p class="path-line">
        请求地址
        <code id="reqPath">/</code>
      </p>
    </section>
  </main>

  <footer>
    © <span id="currentYear">2026</span> 小胡小胡的书签 · <a href="https://xhxh.vip">xhxh.vip</a>
  </footer>

  <script>
    (function () {
      // 年份
      document.getElementById('currentYear').textContent = new Date().getFullYear();

      // 显示当前请求路径
      var p = decodeURI(location.pathname || '/') + (location.search || '');
      document.getElementById('reqPath').textContent = p.length > 64 ? p.slice(0, 61) + '…' : p;

      // 主题切换
      var btn = document.getElementById('themeToggleButton');
      btn.addEventListener('click', function () {
        var dark = document.documentElement.classList.toggle('dark');
        try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) { }
      });

      // 未手动选择过时，跟随系统主题变化
      try {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
          if (localStorage.getItem('theme')) return;
          document.documentElement.classList.toggle('dark', e.matches);
        });
      } catch (e) { }
    })();
  </script>
</body>

</html>
