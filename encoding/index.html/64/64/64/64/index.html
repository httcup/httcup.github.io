<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>编解码工具</title>
<style>
  :root {
    --bg: #f6f7fb;
    --card: #ffffff;
    --text: #1f2329;
    --text-2: #6b7280;
    --border: #e5e7eb;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-soft: #eff6ff;
    --danger: #dc2626;
    --radius: 12px;
    --shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111827;
      --card: #1f2937;
      --text: #f3f4f6;
      --text-2: #9ca3af;
      --border: #374151;
      --primary: #60a5fa;
      --primary-hover: #93c5fd;
      --primary-soft: rgba(96, 165, 250, 0.12);
      --danger: #f87171;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body{ height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 24px 16px 48px;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 860px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 28px; }
  header h1 { font-size: 28px; font-weight: 700; letter-spacing: 0.5px; }
  header .sub { color: var(--text-2); margin-top: 8px; font-size: 14px; }
  .notice {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--primary-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 20px;
    font-size: 13.5px;
    color: var(--text-2);
  }
  .notice strong { color: var(--text); display: block; margin-bottom: 2px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 14px; }
  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  label { display: block; font-size: 13px; font-weight: 500; color: var(--text-2); margin-bottom: 6px; }
  textarea, select {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    font-size: 14px;
    padding: 10px 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  textarea { resize: vertical; min-height: 110px; line-height: 1.5; }
  textarea:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  select { font-family: inherit; cursor: pointer; appearance: auto; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
  .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
  button {
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
    font-family: inherit;
  }
  button:active { transform: translateY(1px); }
  .btn-primary { background: var(--primary); color: #fff; flex: 1; min-width: 120px; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-ghost { background: transparent; color: var(--text-2); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--primary); border-color: var(--primary); }
  .result-area { position: relative; }
  .result-actions {
    position: absolute;
    top: 8px;
    right: 8px;
    display: flex;
    gap: 6px;
  }
  .result-actions button {
    padding: 5px 12px;
    font-size: 12.5px;
    font-weight: 500;
    border-radius: 6px;
  }
  .btn-copy { background: var(--primary-soft); color: var(--primary); border: 1px solid var(--border); }
  .btn-copy:hover { background: var(--primary); color: #fff; }
  .btn-reverse { background: transparent; color: var(--text-2); border: 1px dashed var(--border); }
  .btn-reverse:hover { color: var(--primary); border-color: var(--primary); border-style: solid; }
  .error-msg { color: var(--danger); font-size: 13px; margin-top: 8px; display: none; }
  .error-msg.show { display: block; }
  .hint { color: var(--text-2); font-size: 12.5px; margin-top: 6px; }
  footer { text-align: center; color: var(--text-2); font-size: 12.5px; margin-top: 24px; }
  footer a { color: var(--primary); text-decoration: none; }
  .hidden { display: none !important; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); margin-bottom: 10px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>编解码工具</h1>
    <p class="sub">Base64 · Hex · URL · HTML 实体 ｜ 编码 / 解码</p>
  </header>

  <div class="notice">
    <div>
      <strong>编码不是加密</strong>
      Base64 等编码只是格式转换，不能保护秘密。输入与结果均在本地浏览器处理：<b>不上传、不写入 URL、不保存</b>，请放心使用。
    </div>
  </div>

  <div class="card">
    <h2>输入文本</h2>
    <div class="field">
      <textarea id="input" placeholder="在此输入要转换的内容…" spellcheck="false"></textarea>
    </div>

    <div class="row">
      <div class="field">
        <label for="format">编码格式</label>
        <select id="format">
          <option value="base64">Base64</option>
          <option value="hex">Hex</option>
          <option value="url">URL</option>
          <option value="html">HTML 实体</option>
        </select>
      </div>
      <div class="field">
        <label for="action">操作</label>
        <select id="action">
          <option value="encode">编码</option>
          <option value="decode">解码</option>
        </select>
      </div>
    </div>

    <div class="field hidden" id="urlModeField">
      <label for="urlMode">URL 模式</label>
      <select id="urlMode">
        <option value="component">组件模式（+ 原样保留）</option>
        <option value="form">表单模式（+ 还原为空格）</option>
      </select>
      <div class="hint">组件模式按 URL 组件规则处理，空格编码为 %20；表单模式遵循 application/x-www-form-urlencoded，空格编码为 +。</div>
    </div>

    <div class="btn-row">
      <button id="convertBtn" class="btn-primary">转换</button>
    </div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="card result-area">
    <h2>转换结果</h2>
    <div class="result-actions">
      <button id="copyBtn" class="btn-copy">复制</button>
      <button id="reverseBtn" class="btn-reverse">使用结果反向转换</button>
    </div>
    <textarea id="output" readonly placeholder="结果将显示在这里…" spellcheck="false"></textarea>
    <div class="hint" id="copyHint"></div>
  </div>

  <footer>
    纯前端本地工具，无任何外部请求。可自行部署到 GitHub Pages / Vercel / Netlify 等静态托管。
  </footer>
</div>

<script>
(function () {
  "use strict";

  var inputEl = document.getElementById("input");
  var outputEl = document.getElementById("output");
  var formatEl = document.getElementById("format");
  var actionEl = document.getElementById("action");
  var urlModeEl = document.getElementById("urlMode");
  var urlModeField = document.getElementById("urlModeField");
  var convertBtn = document.getElementById("convertBtn");
  var copyBtn = document.getElementById("copyBtn");
  var reverseBtn = document.getElementById("reverseBtn");
  var errorMsg = document.getElementById("errorMsg");
  var copyHint = document.getElementById("copyHint");

  /* ---------- UTX-8 安全的 Base64 ---------- */
  function utf8ToBytes(str) {
    return new TextEncoder().encode(str);
  }
  function bytesToUtf8(bytes) {
    return new TextDecoder("utf-8", { fatal: true }).decode(bytes);
  }
  function bytesToBase64(bytes) {
    var binary = "";
    var chunk = 0x8000;
    for (var i = 0; i < bytes.length; i += chunk) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(binary);
  }
  function base64ToBytes(b64) {
    var binary = atob(b64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  /* ---------- Hex ---------- */
  function bytesToHex(bytes) {
    var out = [];
    for (var i = 0; i < bytes.length; i++) {
      out.push(bytes[i].toString(16).padStart(2, "0"));
    }
    return out.join("");
  }
  function hexToBytes(hex) {
    // 容忍空格、0x 前缀、逗号、连字符等分隔符
    var cleaned = hex
      .replace(/^0x/i, "")
      .replace(/[\s,，、;；:\-]/g, "")
      .trim();
    if (cleaned.length === 0) throw new Error("空内容");
    if (cleaned.length % 2 !== 0) throw new Error("Hex 字符串长度必须为偶数");
    if (!/^[0-9a-fA-F]+$/.test(cleaned)) throw new Error("包含非 Hex 字符");
    var bytes = new Uint8Array(cleaned.length / 2);
    for (var i = 0; i < bytes.length; i++) {
      bytes[i] = parseInt(cleaned.substr(i * 2, 2), 16);
    }
    return bytes;
  }

  /* ---------- HTML 实体 ---------- */
  var HTML_ENTITIES = {
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  };
  function htmlEncode(str) {
    return str.replace(/[&<>"']/g, function (ch) { return HTML_ENTITIES[ch]; });
  }
  function htmlDecode(str) {
    // 利用 DOM 解码实体；textarea 内不会执行脚本，安全
    var el = document.createElement("textarea");
    el.innerHTML = str;
    return el.value;
  }

  /* ---------- 主转换 ---------- */
  function convert() {
    errorMsg.classList.remove("show");
    copyHint.textContent = "";
    var text = inputEl.value;
    var format = formatEl.value;
    var action = actionEl.value;
    var urlMode = urlModeEl.value;

    if (!text) {
      outputEl.value = "";
      return;
    }

    try {
      var result = doConvert(text, format, action, urlMode);
      outputEl.value = result;
    } catch (e) {
      outputEl.value = "";
      errorMsg.textContent = (action === "decode" ? "解码失败" : "编码失败") + "：" + (e && e.message ? e.message : String(e));
      errorMsg.classList.add("show");
    }
  }

  function doConvert(text, format, action, urlMode) {
    var bytes;
     if (action === "encode") {
      switch (format) {
        case "base64":
          return bytesToBase64(utf8ToBytes(text));
        case "hex":
          return bytesToHex(utf8ToBytes(text));
        case "url":
          if (urlMode === "form") {
            return encodeURIComponent(text).replace(/%20/g, "+");
          }
          return encodeURIComponent(text);
        case "html":
          return htmlEncode(text);
        default:
          throw new Error("未知格式");
      }
    } else {
      switch (format) {
        case "base64":
          return bytesToUtf8(base64ToBytes(text.trim()));
        case "hex":
          return bytesToUtf8(hexToBytes(text));
        case "url":
          if (urlMode === "form") {
            return decodeURIComponent(text.replace(/\+/g, " "));
          }
          return decodeURIComponent(text);
        case "html":
          return htmlDecode(text);
        default:
          throw new Error("未知格式");
      }
    }
  }

  /* ---------- 交互 ---------- */
  function updateUrlModeVisibility() {
    urlModeField.classList.toggle("hidden", formatEl.value !== "url");
  }

  function copyResult() {
    if (!outputEl.value) return;
    var done = function () {
      copyHint.textContent = "已复制到剪贴板";
      setTimeout(function () { copyHint.textContent = ""; }, 1600);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(outputEl.value).then(done, function () {
        fallbackCopy(done);
      });
    } else {
      fallbackCopy(done);
    }
  }

  function fallbackCopy(onDone) {
    outputEl.select();
    outputEl.setSelectionRange(0, outputEl.value.length);
    try {
      document.execCommand("copy");
      onDone();
    } catch (e) {
      copyHint.textContent = "复制失败，请手动选择复制";
    }
  }

  function reverseConvert() {
    if (!outputEl.value) return;
    inputEl.value = outputEl.value;
    // 自动切换方向：编码 <-> 解码
    actionEl.value = actionEl.value === "encode" ? "decode" : "encode";
    convert();
  }

  formatEl.addEventListener("change", updateUrlModeVisibility);
  convertBtn.addEventListener("click", convert);
  copyBtn.addEventListener("click", copyResult);
  reverseBtn.addEventListener("click", reverseConvert);
  // Ctrl/Cmd + Enter 快捷转换
  inputEl.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
      e.preventDefault();
      convert();
    }
  });

  updateUrlModeVisibility();
})();
</script>
</body>
</html>
